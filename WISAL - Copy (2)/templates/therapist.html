<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WISAL | Therapist Dashboard</title>
        <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body>
        <aside class="sidebar">
            <h1 class="logo">WISAL</h1>
            <nav>
                <a
                href="{{ url_for('therapist_dashboard') }}" class="active">
                Dashboard
            </a>
            <a href="#patients">
                My Patients
            </a>
            </nav>

            <a href="{{ url_for('logout') }}" class="logout">
                logout
            </a>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div>
                    <h2>Therapist Dashboard</h2>
                    <p>Manage your patients and their Home Exercise Programs.</p>
                </div>
                <div class="therapist-profile">
                    <span>Physical Therapist</span>
                </div>
            </header>

            <section id="patients" class="patients-section">
                <h3>My Patients</h3>
                {% for patient in patients %}
                <div class="patient-card">
                     <div>
                         <h4>{{ patient.name }}</h4>
                          <p>Patient ID: {{ patient.id }}</p>
                        </div>
                         <a href="{{ url_for('patient_details', patient_id=patient.id) }}" class="view-button"> View Details</a>
                        </div>
                        {% else %}
                        <p>No patients assigned yet.</p>
                         {% endfor %}

            </section>

        </main>

    </body>
</html>
